name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Quartz
        run: git clone https://github.com/jackyzha0/quartz.git quartz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy content into Quartz
        run: |
          cp quartz.config.ts quartz/quartz.config.ts
          rsync -av \
            --exclude='.git' \
            --exclude='.obsidian' \
            --exclude='.claude' \
            --exclude='.github' \
            --exclude='quartz' \
            --exclude='quartz.config.ts' \
            --exclude='CLAUDE.md' \
            --exclude='LICENSE' \
            . quartz/content/

      - name: Build
        working-directory: quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
